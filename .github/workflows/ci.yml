name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: core
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check src tests deno.json
      - run: deno lint
      - run: deno check src/mod.js
      - run: deno task coverage
